<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="360" viewBox="0 0 1440 360" role="img" aria-labelledby="title desc">
  <title id="title">rigsolve</title>
  <desc id="desc">A rigsolve command turns a GPU target into a compatible torch, CUDA, and flash-attn plan.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1f2937" stroke-width="1" opacity="0.5"/>
    </pattern>
  </defs>
  <rect width="1440" height="360" rx="20" fill="#090b0f"/>
  <rect width="1440" height="360" rx="20" fill="url(#grid)"/>
  <rect x="1" y="1" width="1438" height="358" rx="19" fill="none" stroke="#272c34" stroke-width="2"/>

  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif">
    <text x="72" y="158" fill="#f4f4f5" font-size="88" font-weight="720" letter-spacing="-4">rig<tspan fill="#3b82f6">solve</tspan></text>
    <text x="76" y="208" fill="#a1a1aa" font-size="23">GPU compatibility, explained.</text>
    <text x="76" y="260" fill="#71717a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">detect, solve, verify</text>
  </g>

  <g transform="translate(640 45)">
    <rect width="728" height="270" rx="12" fill="#0d1015" stroke="#3f4650" stroke-width="2"/>
    <circle cx="24" cy="24" r="5" fill="#ef4444"/>
    <circle cx="42" cy="24" r="5" fill="#eab308"/>
    <circle cx="60" cy="24" r="5" fill="#22c55e"/>
    <path d="M0 46H728" stroke="#272c34"/>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">
      <text x="28" y="84" fill="#f4f4f5">$ rigsolve solve --want flash-attn</text>
      <text x="28" y="126" fill="#71717a">target</text>
      <text x="118" y="126" fill="#d4d4d8">RTX 4090, driver 580, Python 3.12</text>
      <text x="28" y="168" fill="#71717a">plan</text>
      <text x="118" y="168" fill="#d4d4d8">torch 2.9.0, CUDA 12.6</text>
      <text x="118" y="204" fill="#d4d4d8">flash-attn 2.8.3</text>
      <text x="28" y="244" fill="#71717a">status</text>
      <text x="118" y="244" fill="#4ade80">compatible plan</text>
    </g>
  </g>
</svg>
