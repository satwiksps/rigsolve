version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

sphinx:
  configuration: docs/conf.py
  builder: dirhtml
  fail_on_warning: true

formats:
  - pdf
  - epub

python:
  install:
    - requirements: docs/requirements.txt
    - method: pip
      path: .

search:
  ranking:
    reference/api/*: 1
    release-notes: -1
  ignore:
    - release-notes.html
