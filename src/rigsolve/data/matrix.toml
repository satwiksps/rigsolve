[[known_broken]]
id = "flashattn-post1-torch29-filename"
description = "flash-attn v2.8.3.post1 with torch 2.9: setup.py constructs a 2.8.3.post1 wheel filename, but the two CUDA 13 / torch 2.9 release assets are named 2.8.3, so the automatic request misses the published asset and falls back to a source build."
match = { "cuda_line" = "13", package = "flash-attn", "source_build" = false, torch = "2.9", version = "2.8.3.post1" }
workaround = "For CPython 3.12 Linux, install the matching 2.8.3-named release asset by explicit URL; otherwise build from source or choose a published matching version."
tier = 0
