name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  preflight:
    name: Validate release tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - name: Require a tag from main
        shell: bash
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          if [[ "$(git cat-file -t "${GITHUB_REF}")" != "tag" ]]; then
            echo "Release tags must be annotated tags, not lightweight tags." >&2
            exit 1
          fi
          tag_commit="$(git rev-parse "${GITHUB_REF}^{commit}")"
          if ! git merge-base --is-ancestor "$tag_commit" origin/main; then
            echo "Release tags must point to a commit on main." >&2
            exit 1
          fi
      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import json
          import os
          import pathlib
          import re
          import tomllib

          root = pathlib.Path(".")
          version = tomllib.loads((root / "pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          tag = os.environ["RELEASE_TAG"]
          if tag != f"v{version}":
              raise SystemExit(f"tag {tag!r} does not match pyproject version {version!r}")

          def matched_version(path, pattern):
              text = (root / path).read_text(encoding="utf-8")
              match = re.search(pattern, text, flags=re.MULTILINE)
              if match is None:
                  raise SystemExit(f"could not find the current version in {path}")
              return match.group(1)

          package = json.loads((root / "site/package.json").read_text(encoding="utf-8"))
          package_lock = json.loads((root / "site/package-lock.json").read_text(encoding="utf-8"))
          versions = {
              "src/rigsolve/__init__.py": matched_version(
                  "src/rigsolve/__init__.py", r'^\s*__version__\s*=\s*["\']([^"\']+)["\']'
              ),
              "CITATION.cff": matched_version(
                  "CITATION.cff", r'^version:\s*["\']?([^\s"\']+)'
              ),
              "site/package.json": package["version"],
              "site/package-lock.json": package_lock["version"],
              "site/package-lock.json packages root": package_lock["packages"][""]["version"],
              "site/app/page.tsx softwareVersion": matched_version(
                  "site/app/page.tsx", r'softwareVersion:\s*["\']([^"\']+)["\']'
              ),
              "site/app/page.tsx release label": matched_version(
                  "site/app/page.tsx", r'\bv(\d+\.\d+\.\d+)\s+/'
              ),
          }
          mismatches = {path: found for path, found in versions.items() if found != version}
          if mismatches:
              details = ", ".join(f"{path}={found!r}" for path, found in mismatches.items())
              raise SystemExit(f"version metadata does not match pyproject version {version!r}: {details}")
          PY

  python-tests:
    name: Python ${{ matrix.python-version }}
    needs: preflight
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest --cov=rigsolve --cov-report=term-missing

  quality:
    name: Quality
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install contributor dependencies
        run: python -m pip install -e ".[dev]" twine==7.0.0
      - name: Lint
        run: python -m ruff check .
      - name: Format
        run: python -m ruff format --check .
      - name: Type check
        run: python -m mypy src/rigsolve
      - name: Validate bundled matrix
        run: python -m rigsolve --matrix src/rigsolve/data/matrix.toml matrix stats --json
      - name: Check documentation links
        run: python .github/scripts/check_docs.py

  website:
    name: Website
    needs: preflight
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install website dependencies
        run: npm ci
      - name: Validate website
        run: npm test

  documentation:
    name: Documentation
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install documentation dependencies
        run: |
          python -m pip install -e .
          python -m pip install -r docs/requirements.txt
      - name: Build documentation
        run: python -m sphinx -W --keep-going -b dirhtml docs docs/_build/dirhtml

  build:
    name: Build and validate distributions
    needs: [python-tests, quality, website, documentation]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Build distributions
        run: |
          python -m pip install build==1.5.0 twine==7.0.0
          python -m build
          python -m twine check dist/*
      - name: Smoke test the built wheel
        shell: bash
        run: |
          wheel="$(realpath dist/*.whl)"
          smoke_env="${RUNNER_TEMP}/rigsolve-wheel-smoke"
          python -m venv "$smoke_env"
          "$smoke_env/bin/python" -m pip install "$wheel"
          "$smoke_env/bin/python" -m pip check
          cd "$RUNNER_TEMP"
          "$smoke_env/bin/rigsolve" --version
          "$smoke_env/bin/rigsolve" matrix stats --json
          "$smoke_env/bin/rigsolve" solve \
            --want "flash-attn==2.8.3" \
            --target "RTX 4090,driver=580.65,python=3.12,linux" \
            --output json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI
    needs: build
    if: github.repository == 'satwiksps/rigsolve'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/rigsolve/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          skip-existing: true

  github-release:
    name: Create GitHub release
    needs: [build, publish-pypi]
    if: github.repository == 'satwiksps/rigsolve'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: distributions
          path: dist/
      - name: Create release or upload artifacts on retry
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/*
          else
            gh release create "${GITHUB_REF_NAME}" dist/* --verify-tag --notes-from-tag
          fi
