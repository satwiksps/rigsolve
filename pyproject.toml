[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "rigsolve"
version = "0.1.2"
description = "Resolve torch, CUDA, and native extension compatibility from sourced evidence."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "rigsolve contributors" }]
keywords = [
  "cuda",
  "pytorch",
  "mlops",
  "gpu",
  "dependency-resolution",
  "flash-attention",
  "developer-tools",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = [
  "packaging>=24.2",
  "tomli>=2.2; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "mypy>=1.14",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.9",
  "tomli>=2.2",
]

[project.urls]
Homepage = "https://github.com/satwiksps/rigsolve"
Documentation = "https://github.com/satwiksps/rigsolve#readme"
Issues = "https://github.com/satwiksps/rigsolve/issues"
Source = "https://github.com/satwiksps/rigsolve"

[project.scripts]
rigsolve = "rigsolve.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/rigsolve"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/README.md",
  "/LICENSE",
  "/CHANGELOG.md",
  "/CITATION.cff",
  "/CODE_OF_CONDUCT.md",
  "/CONTRIBUTING.md",
  "/SECURITY.md",
  "/docs",
  "/examples",
  "/.github/scripts",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["rigsolve"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["rigsolve"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["rigsolve"]
warn_unreachable = true
